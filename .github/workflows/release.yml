name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: --bundles deb,rpm
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        run: bun install

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'piu v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false

  update-homebrew-cask:
    needs: publish-release
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download DMGs and compute SHA256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "v${VERSION}" --repo "$REPO" --pattern "Piu_${VERSION}_aarch64.dmg" --output arm64.dmg
          gh release download "v${VERSION}" --repo "$REPO" --pattern "Piu_${VERSION}_x64.dmg" --output x64.dmg
          SHA_ARM64=$(shasum -a 256 arm64.dmg | cut -d' ' -f1)
          SHA_X64=$(shasum -a 256 x64.dmg | cut -d' ' -f1)
          if [ "$SHA_ARM64" = "$SHA_X64" ]; then
            echo "::error::ARM64 and x64 DMGs have identical SHA256 — download likely failed"
            exit 1
          fi
          echo "SHA_ARM64=$SHA_ARM64" >> "$GITHUB_ENV"
          echo "SHA_X64=$SHA_X64" >> "$GITHUB_ENV"

      - name: Update Homebrew cask in tap repo
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CASK_CONTENT=$(cat <<CASK
          cask "piu" do
            version "${VERSION}"

            on_arm do
              url "https://github.com/dickwu/piu/releases/download/v#{version}/Piu_#{version}_aarch64.dmg"
              sha256 "${SHA_ARM64}"
            end
            on_intel do
              url "https://github.com/dickwu/piu/releases/download/v#{version}/Piu_#{version}_x64.dmg"
              sha256 "${SHA_X64}"
            end

            name "PIU"
            desc "Native desktop API client — Postman alternative built with Tauri"
            homepage "https://github.com/dickwu/piu"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "Piu.app"

            caveats <<~EOS
              If macOS shows a "damaged app" or quarantine warning, run:
                sudo xattr -d com.apple.quarantine /Applications/Piu.app
            EOS

            zap trash: [
              "~/Library/Application Support/com.dickwu.piu",
              "~/Library/Caches/com.dickwu.piu",
              "~/Library/Preferences/com.dickwu.piu.plist",
              "~/Library/Saved Application State/com.dickwu.piu.savedState",
            ]
          end
          CASK
          )
          # Remove heredoc indentation
          CASK_CONTENT=$(echo "$CASK_CONTENT" | sed 's/^          //')

          # Get current file SHA (needed for update)
          CURRENT_SHA=$(gh api repos/dickwu/homebrew-tap/contents/Casks/piu.rb --jq '.sha' 2>/dev/null || echo "")

          ENCODED=$(echo "$CASK_CONTENT" | base64)

          if [ -n "$CURRENT_SHA" ]; then
            gh api repos/dickwu/homebrew-tap/contents/Casks/piu.rb \
              -X PUT \
              -f message="chore: bump PIU cask to v${VERSION}" \
              -f content="$ENCODED" \
              -f sha="$CURRENT_SHA"
          else
            gh api repos/dickwu/homebrew-tap/contents/Casks/piu.rb \
              -X PUT \
              -f message="chore: bump PIU cask to v${VERSION}" \
              -f content="$ENCODED"
          fi
