[package]
name = "piu"
version = "0.1.41"
description = "A desktop API management application."
authors = []
edition = "2021"

[lib]
name = "piu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", features = ["stream"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt-multi-thread", "process"] }
turso = "0.5.0-pre"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
urlencoding = "2"
serde_json_path = "0.7"
globset = "0.4"
rmcp = { version = "0.16", features = ["server", "transport-streamable-http-server"] }
schemars = "1.0"
anyhow = "1.0"
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-connector = { git = "https://github.com/dickwu/tauri-connector", version = "0.5.0", optional = true }

[features]
default = []
devtools = ["tauri-plugin-connector"]
